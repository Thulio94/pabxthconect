services:
  app:
    build:
      context: ..
      dockerfile: production/Dockerfile.app
    restart: unless-stopped
    working_dir: /var/www/html
    command: >-
      sh -lc 'mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/pbx-runtime storage/app/pbx-recordings
      && chown -R www-data:www-data storage bootstrap/cache
      && php artisan migrate --force
      && php artisan optimize
      && php artisan pbx:provision
      && exec php-fpm'
    volumes:
      - app_storage:/var/www/html/storage
      - pbx_runtime:/var/www/html/storage/app/pbx-runtime
      - pbx_recordings:/var/www/html/storage/app/pbx-recordings
    environment: &laravel_environment
      APP_NAME: ${APP_NAME:-Tela do Agente - Thconect}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Defina APP_KEY no Easypanel}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Defina APP_URL no Easypanel}
      APP_LOCALE: pt_BR
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?Defina DB_DATABASE no Easypanel}
      DB_USERNAME: ${DB_USERNAME:?Defina DB_USERNAME no Easypanel}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no Easypanel}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SESSION_ENCRYPT: "true"
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no Easypanel}
      FILESYSTEM_DISK: local
      PBX_RUNTIME_PATH: /var/www/html/storage/app/pbx-runtime
      PBX_AMI_HOST: asterisk
      PBX_AMI_PORT: 5038
      PBX_AMI_USERNAME: ${PBX_AMI_USERNAME:?Defina PBX_AMI_USERNAME no Easypanel}
      PBX_AMI_SECRET: ${PBX_AMI_SECRET:?Defina PBX_AMI_SECRET no Easypanel}
      PBX_SIP_DOMAIN: ${PBX_SIP_DOMAIN:?Defina PBX_SIP_DOMAIN no Easypanel}
      PBX_WEBSOCKET_URL: ${PBX_WEBSOCKET_URL:?Defina PBX_WEBSOCKET_URL no Easypanel}
      MAIL_MAILER: log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      asterisk:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    build:
      context: ..
      dockerfile: production/Dockerfile.nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: ..
      dockerfile: production/Dockerfile.app
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -lc 'mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs && chown -R www-data:www-data storage bootstrap/cache && exec php artisan queue:work --sleep=1 --tries=3 --timeout=90 --max-time=3600'
    volumes:
      - app_storage:/var/www/html/storage
      - pbx_runtime:/var/www/html/storage/app/pbx-runtime
      - pbx_recordings:/var/www/html/storage/app/pbx-recordings
    environment: *laravel_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: production/Dockerfile.app
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -lc 'mkdir -p storage/logs storage/app/pbx-recordings && chown -R www-data:www-data storage bootstrap/cache && exec php artisan schedule:work'
    volumes:
      - app_storage:/var/www/html/storage
      - pbx_runtime:/var/www/html/storage/app/pbx-runtime
      - pbx_recordings:/var/www/html/storage/app/pbx-recordings
    environment: *laravel_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pbx-events:
    build:
      context: ..
      dockerfile: production/Dockerfile.app
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -lc 'mkdir -p storage/logs storage/app/pbx-recordings && chown -R www-data:www-data storage bootstrap/cache && exec php artisan pbx:events'
    volumes:
      - app_storage:/var/www/html/storage
      - pbx_runtime:/var/www/html/storage/app/pbx-runtime
      - pbx_recordings:/var/www/html/storage/app/pbx-recordings
    environment: *laravel_environment
    depends_on:
      asterisk:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Defina DB_DATABASE no Easypanel}
      POSTGRES_USER: ${DB_USERNAME:?Defina DB_USERNAME no Easypanel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no Easypanel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-lc", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no Easypanel}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  asterisk:
    build:
      context: ..
      dockerfile: production/Dockerfile.asterisk
    restart: unless-stopped
    hostname: thconect-pbx
    environment:
      PBX_AMI_USERNAME: ${PBX_AMI_USERNAME:?Defina PBX_AMI_USERNAME no Easypanel}
      PBX_AMI_SECRET: ${PBX_AMI_SECRET:?Defina PBX_AMI_SECRET no Easypanel}
      PBX_PUBLIC_IP: ${PBX_PUBLIC_IP:?Defina PBX_PUBLIC_IP no Easypanel}
      PBX_LOCAL_NET: ${PBX_LOCAL_NET:-10.0.0.0/8}
    ports:
