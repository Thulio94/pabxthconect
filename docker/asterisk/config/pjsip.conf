[global]
user_agent = Thconect PBX
endpoint_identifier_order = auth_username,username,ip,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

; Laravel writes these generated fragments after provisioning an extension or route.
; They are intentionally empty in a new installation.
#include "generated/pjsip_endpoints.conf"
#include "generated/pjsip_trunks.conf"
